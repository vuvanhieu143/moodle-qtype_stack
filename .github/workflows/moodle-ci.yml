name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            moodle-branch: 'MOODLE_502_STABLE'
            database: 'pgsql'
            maxima: 'SBCL'
            moodle-app: false
          - php: '8.4'
            moodle-branch: 'MOODLE_501_STABLE'
            database: 'pgsql'
            maxima: 'SBCL'
            moodle-app: true
          - php: '8.2'
            moodle-branch: 'MOODLE_500_STABLE'
            database: 'pgsql'
            maxima: 'SBCL'
            moodle-app: false
          - php: '8.2'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'mariadb'
            maxima: 'SBCL'
            moodle-app: false
          - php: '8.1'
            moodle-branch: 'MOODLE_402_STABLE'
            database: 'pgsql'
            maxima: 'SBCL'
            moodle-app: true

    steps:
      - name: Install Maxima 5.44.0 and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y maxima sbcl libtinfo5

          sudo locale-gen en_AU.UTF-8
          echo "LANG=en_AU.UTF-8" >> $GITHUB_ENV

          # Verify installed Maxima version
          maxima --version

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Validate composer.json and composer.lock
        if: ${{ fromJSON(matrix.php) >= 8.2 }}
        run: |
          if [ -d "plugin/api" ]; then
            cd plugin/api
            composer validate
          fi

      - name: Cache Composer packages
        id: composer-cache
        if: ${{ fromJSON(matrix.php) >= 8.2 }}
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Dependencies
        if: ${{ fromJSON(matrix.php) >= 8.2 }}
        run: |
          if [ -d "plugin/api" ]; then
            cd plugin/api
            composer install
          fi

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci and environment
        run: |
          moodle-plugin-ci add-plugin maths/moodle-qbehaviour_dfexplicitvaildate
          moodle-plugin-ci add-plugin maths/moodle-qbehaviour_dfcbmexplicitvaildate
          moodle-plugin-ci add-plugin maths/moodle-qbehaviour_adaptivemultipart
          moodle-plugin-ci add-plugin maths/moodle-qbank_importasversion

          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

          # STACK Configuration matching Maxima 5.44.0 & SBCL 2.5.2
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_MAXIMAVERSION",       "5.44.0");'
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_MAXIMACOMMAND",       "maxima");'
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_MAXIMACOMMANDOPT",    "timeout --kill-after=10s 10s ${{ github.workspace }}/maxima_opt_auto -eval '\''(cl-user::run)'\''");'
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_MAXIMACOMMANDSERVER", "http://pool.home:8080/MaximaPool/MaximaPool");'
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_CASTIMEOUT",          "100");'
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_MAXIMALIBRARIES",     "stats, distrib, descriptive, simplex");'
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_CASPREPARSE",         "true");'
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_PLATFORM",            "linux-optimised");'
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_CASRESULTSCACHE",     "db");'
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_PLOTCOMMAND",         "");'
          moodle-plugin-ci add-config 'define("QTYPE_STACK_TEST_CONFIG_CASDEBUGGING",        "0");'

          cp ${{ github.workspace }}/moodledata/phpu_moodledata/stack/maxima_opt_auto ${{ github.workspace }}/maxima_opt_auto
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          MOODLE_APP: ${{ matrix.moodle-app }}

      - name: PHP Lint
        if: ${{ matrix.moodle-branch == 'main' || matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector
        continue-on-error: true
        if: ${{ matrix.moodle-branch == 'main' || matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci phpcpd

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ matrix.moodle-branch == 'main' || matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        continue-on-error: true
        if: ${{ matrix.moodle-branch == 'main' || matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Moodle PHPDoc Checker
        continue-on-error: true
        if: ${{ matrix.moodle-branch == 'main' || matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci phpdoc

      - name: Validating
        if: ${{ matrix.moodle-branch == 'main' || matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ matrix.moodle-branch == 'main' || matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ matrix.moodle-branch == 'main' || matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ matrix.moodle-branch == 'main' || matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci grunt

      - name: PHPUnit tests
        if: ${{ matrix.moodle-branch == 'main' || matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci phpunit

      - name: JS unit tests
        if: ${{ matrix.moodle-branch == 'MOODLE_501_STABLE' || matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: |
          if [ -d "plugin/tests/jest" ]; then
            cd plugin/tests/jest
            npm install
            npm test
          fi

      - name: Behat features
        run: moodle-plugin-ci behat --profile chrome --auto-rerun 12
        env:
          MOODLE_BEHAT_SELENIUM_IMAGE: selenium/standalone-chrome:145.0-20260222